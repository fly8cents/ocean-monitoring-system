<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCEAN MONITORING OS</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root {
    --bg: #04070c;
    --panel: rgba(13, 22, 34, 0.55);
    --panel-solid: #0d1622;
    --line: rgba(34, 211, 238, 0.16);
    --line-bright: rgba(34, 211, 238, 0.45);
    --cyan: #22d3ee;
    --cyan-deep: #0e7490;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --text: #dbe7f0;
    --dim: #5b7a94;
    --mono: 'Consolas', 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(34,211,238,0.08), transparent 60%),
      linear-gradient(180deg, #05080d 0%, #04070c 100%);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ===== 顶部 HUD 标题栏 ===== */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(34,211,238,0.06), transparent);
    flex-shrink: 0;
  }
  header .brand { display: flex; align-items: baseline; gap: 14px; }
  header .brand .en {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--cyan);
    text-shadow: 0 0 12px rgba(34,211,238,0.5);
  }
  header .brand .cn { font-size: 13px; color: var(--dim); letter-spacing: 6px; }
  header .status {
    display: flex; align-items: center; gap: 18px;
    font-family: var(--mono); font-size: 13px; color: var(--dim);
  }
  header .status .online { display: flex; align-items: center; gap: 6px; color: var(--green); }
  header .status .online .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite;
  }
  header .status .clock { font-size: 20px; color: var(--cyan); font-variant-numeric: tabular-nums; }
  header .status .alarm { display: flex; align-items: center; gap: 6px; color: var(--red); }
  header .status .alarm .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ===== 告警横幅（物理一致性异常）===== */
  #alarmBar {
    display: none;
    flex-shrink: 0;
    margin: 8px 16px 0;
    padding: 8px 14px;
    border: 1px solid rgba(248, 113, 113, 0.5);
    background: rgba(248, 113, 113, 0.08);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--red);
    letter-spacing: 1px;
    animation: alarmFlash 1s ease-in-out infinite;
  }
  @keyframes alarmFlash { 0%,100% { border-color: rgba(248,113,113,0.45); box-shadow: 0 0 6px rgba(248,113,113,0.1); } 50% { border-color: rgba(248,113,113,0.9); box-shadow: 0 0 16px rgba(248,113,113,0.35); } }

  /* ===== 主体三栏 ===== */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 250px 1fr 300px;
    grid-template-rows: 1fr;
    gap: 12px;
    padding: 12px 16px;
    min-height: 0;
  }

  /* 通用面板 + 四角 HUD 装饰 */
  .panel {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .panel .ptitle {
    flex-shrink: 0;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--cyan);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel .ptitle .zh { color: var(--dim); font-family: var(--sans); font-size: 11px; letter-spacing: 2px; }

  /* ===== 左栏：浮标档案 ===== */
  #left { display: flex; flex-direction: column; }
  #archive { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .buoy {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all .18s;
    font-family: var(--mono);
  }
  .buoy .id { color: var(--text); letter-spacing: 1px; }
  .buoy .id span { color: var(--cyan); }
  .buoy .loc { font-size: 10px; color: var(--dim); }
  .buoy:hover { border-color: var(--line-bright); background: rgba(34,211,238,0.05); }
  .buoy.active {
    border-color: var(--cyan);
    background: rgba(34,211,238,0.08);
    box-shadow: inset 2px 0 0 var(--cyan);
  }
  .buoy.active .id { color: var(--cyan); }
  #detail {
    flex-shrink: 0; padding: 12px 14px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    line-height: 1.9;
  }
  #detail .row { display: flex; justify-content: space-between; }
  #detail .row .k { color: var(--dim); }
  #detail .row .v { color: var(--text); }
  #detail .row .v.cyan { color: var(--cyan); }

  /* ===== 中栏：地图 ===== */
  #mapwrap { position: relative; }
  #map { width: 100%; height: 100%; }
  #mapwrap .legend {
    position: absolute; right: 12px; top: 44px; z-index: 3;
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    border: 1px solid var(--line); padding: 6px 8px; background: rgba(4,7,12,0.6);
  }

  /* ===== 右栏：实时数据流 ===== */
  #stream { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .metric {
    border: 1px solid var(--line);
    padding: 12px 14px;
    position: relative;
    transition: border-color .2s;
  }
  .metric::before { content: ''; position: absolute; left: 0; top: 0; width: 3px; height: 100%; background: var(--cyan); opacity: 0.5; }
  .metric .en { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--dim); }
  .metric .val { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--text); margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .metric .unit { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .metric .bar { margin-top: 8px; height: 3px; background: rgba(34,211,238,0.1); position: relative; overflow: hidden; }
  .metric .bar i { position: absolute; left: 0; top: 0; height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width .6s; }
  .metric.warn { border-color: var(--amber); }
  .metric.warn::before { background: var(--amber); }
  .metric.warn .val { color: var(--amber); }
  .metric.bad { border-color: var(--red); }
  .metric.bad::before { background: var(--red); }
  .metric.bad .val { color: var(--red); }

  /* ===== 底部：实时趋势 ===== */
  footer {
    flex-shrink: 0;
    height: 220px;
    border-top: 1px solid var(--line);
    margin: 0 16px 12px;
    position: relative;
    background: var(--panel);
  }
  footer::before, footer::after {
    content: ''; position: absolute; width: 10px; height: 10px; pointer-events: none;
  }
  footer::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  footer::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  footer .ftitle {
    position: absolute; top: 10px; left: 16px; z-index: 3;
    font-family: var(--mono); font-size: 12px; letter-spacing: 3px; color: var(--cyan);
  }
  .metric-btns { position: absolute; top: 10px; right: 14px; z-index: 3; display: flex; gap: 6px; }
  .mbtn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    padding: 4px 12px; cursor: pointer; color: var(--dim);
    border: 1px solid var(--line); background: transparent; transition: all .18s;
  }
  .mbtn:hover { color: var(--cyan); border-color: var(--line-bright); }
  .mbtn.active { color: #04070c; background: var(--cyan); border-color: var(--cyan); font-weight: 700; }
  #trend { width: 100%; height: 100%; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-family: var(--mono); font-size: 13px; letter-spacing: 2px; }

  /* ===== 档案库 ===== */
  .archive-btn {
    flex-shrink: 0;
    margin: 10px 14px;
    padding: 9px 0;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--cyan);
    background: transparent;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all .18s;
  }
  .archive-btn:hover { border-color: var(--cyan); background: rgba(34,211,238,0.08); }

  .modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(2, 4, 8, 0.75);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
  }
  .modal.show { opacity: 1; visibility: visible; }
  .modal-panel {
    width: 84vw; height: 80vh;
    background: var(--panel-solid);
    border: 1px solid var(--line-bright);
    box-shadow: 0 0 40px rgba(34,211,238,0.15);
    display: flex; flex-direction: column;
    position: relative;
    transform: scale(0.96);
    transition: transform .25s ease;
  }
  .modal.show .modal-panel { transform: scale(1); }
  .modal-panel::before, .modal-panel::after {
    content: ''; position: absolute; width: 12px; height: 12px; pointer-events: none;
  }
  .modal-panel::before { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .modal-panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
  .mhead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
  }
  .mhead .en { font-family: var(--mono); color: var(--cyan); letter-spacing: 3px; font-size: 14px; font-weight: 700; }
  .mhead .zh { color: var(--dim); font-size: 11px; margin-left: 10px; letter-spacing: 2px; }
  .mhead .buoy-tag { font-family: var(--mono); font-size: 12px; color: var(--text); margin-left: 14px; }
  .close {
    cursor: pointer; color: var(--dim); font-size: 20px;
    width: 28px; height: 28px; line-height: 26px; text-align: center;
    border: 1px solid var(--line); transition: all .18s; user-select: none;
  }
  .close:hover { color: var(--red); border-color: var(--red); }

  .archive-body { flex: 1; display: grid; grid-template-columns: 180px 1fr; min-height: 0; }
  .date-list { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
  .date-item {
    padding: 8px 10px; font-family: var(--mono); font-size: 12px;
    color: var(--text); border: 1px solid transparent; cursor: pointer; margin-bottom: 4px;
    transition: all .15s;
  }
  .date-item:hover { border-color: var(--line-bright); background: rgba(34,211,238,0.05); }
  .date-item.active { border-color: var(--cyan); background: rgba(34,211,238,0.1); color: var(--cyan); }

  .archive-table-wrap { overflow: auto; padding: 0 12px 12px; }
  .archive-table { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: 12px; }
  .archive-table th, .archive-table td {
    padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap; color: var(--text);
  }
  .archive-table th { color: var(--cyan); font-weight: 400; letter-spacing: 1px; position: sticky; top: 0; background: #0d1622; }
  .archive-table td:first-child, .archive-table th:first-child { text-align: left; color: var(--dim); }
  .archive-table tr:hover td { background: rgba(34,211,238,0.05); }

  /* 档案库 tab */
  .archive-tabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); }
  .atab {
    font-family: var(--mono); font-size: 12px; letter-spacing: 1px;
    padding: 6px 14px; cursor: pointer; color: var(--dim);
    border: 1px solid transparent; border-bottom: none; transition: all .18s;
  }
  .atab:hover { color: var(--cyan); }
  .atab.active { color: var(--cyan); border-color: var(--line); border-bottom: 2px solid var(--cyan); background: rgba(34,211,238,0.05); }

  .export-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    padding: 5px 12px; cursor: pointer; color: var(--green);
    border: 1px solid var(--line); background: transparent; transition: all .18s;
  }
  .export-btn:hover { border-color: var(--green); background: rgba(74,222,128,0.08); }

  .refresh-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    padding: 5px 12px; cursor: pointer; color: var(--cyan);
    border: 1px solid var(--line); background: transparent; transition: all .18s;
  }
  .refresh-btn:hover { border-color: var(--cyan); background: rgba(34,211,238,0.08); }

  .curve-wrap { position: relative; }
  #historyChart { width: 100%; height: 100%; }
  .curve-btns { position: absolute; top: 8px; right: 12px; z-index: 3; display: flex; gap: 6px; }
  .cbtn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    padding: 3px 10px; cursor: pointer; color: var(--dim);
    border: 1px solid var(--line); background: transparent; transition: all .18s;
  }
  .cbtn:hover { color: var(--cyan); border-color: var(--line-bright); }
  .cbtn.active { color: #04070c; background: var(--cyan); border-color: var(--cyan); font-weight: 700; }

  /* ===== 呼吸动画（无操作也动） ===== */
  @keyframes breathe {
    0%, 100% { text-shadow: 0 0 8px rgba(34,211,238,0.35); }
    50% { text-shadow: 0 0 22px rgba(34,211,238,0.8); }
  }
  header .brand .en { animation: breathe 3s ease-in-out infinite; }

  @keyframes panelGlow {
    0%, 100% { box-shadow: inset 0 0 0 rgba(34,211,238,0); }
    50% { box-shadow: inset 0 0 28px rgba(34,211,238,0.05); }
  }
  .panel { animation: panelGlow 4s ease-in-out infinite; }

  /* ===== 交互反馈：hover 位移 + 发光，按下回缩 ===== */
  .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 0 10px rgba(34,211,238,0.25); }
  .export-btn:hover { transform: translateY(-2px); box-shadow: 0 0 10px rgba(74,222,128,0.25); }
  .close:hover { transform: translateY(-2px); box-shadow: 0 0 10px rgba(248,113,113,0.25); }
  .cbtn:hover { transform: translateY(-1px); }
  .date-item:hover { transform: translateX(3px); }

  .refresh-btn:active, .export-btn:active, .close:active, .cbtn:active, .date-item:active {
    transform: scale(0.94);
  }
  .date-item:active { background: rgba(34,211,238,0.15); }

  /* 档案库 view 切换淡入过渡 */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #detailView, #curveView, #summaryView { animation: fadeIn .3s ease; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="en">OCEAN MONITORING OS</span>
      <span class="cn">海洋环境监测终端</span>
    </div>
    <div class="status">
      <span class="online" id="sysStatus"><span class="dot"></span>SYSTEM ONLINE</span>
      <span id="date">----/--/--</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>

  <div id="alarmBar"></div>

  <main>
    <!-- 左栏：浮标档案 -->
    <div class="panel" id="left">
      <div class="ptitle"><span>BUOY ARCHIVE</span><span class="zh">浮标档案</span></div>
      <div id="archive"></div>
      <div id="detail"><div class="empty">SELECT A BUOY</div></div>
      <button class="archive-btn" id="openArchive">HISTORY 历史档案</button>
    </div>

    <!-- 中栏：海域态势 -->
    <div class="panel" id="mapwrap">
      <div class="ptitle"><span>MARINE SITUATION</span><span class="zh">海域态势</span></div>
      <div id="map"></div>
      <div class="legend">◉ BUOY NODE</div>
    </div>

    <!-- 右栏：实时数据流 -->
    <div class="panel" id="right">
      <div class="ptitle"><span>DATA STREAM</span><span class="zh">实时数据流</span></div>
      <div id="stream"><div class="empty">WAITING…</div></div>
    </div>
  </main>

  <footer>
    <div class="ftitle">REALTIME TREND</div>
    <div class="metric-btns" id="mbtns"></div>
    <div id="trend"></div>
  </footer>

  <!-- 档案库模态框 -->
  <div class="modal" id="archiveModal">
    <div class="modal-panel">
      <div class="mhead">
        <div><span class="en">ARCHIVE DATABASE</span><span class="zh">历史档案库</span><span class="buoy-tag" id="archiveBuoyTag"></span></div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="refresh-btn" id="refreshArchive">REFRESH</button>
          <button class="export-btn" id="exportCsv">EXPORT CSV</button>
          <div class="close" id="closeArchive">×</div>
        </div>
      </div>
      <div class="archive-tabs">
        <div class="atab active" data-tab="detail">明细表格</div>
        <div class="atab" data-tab="curve">趋势曲线</div>
        <div class="atab" data-tab="summary">日报汇总</div>
      </div>
      <div class="archive-body">
        <div class="date-list" id="dateList"></div>
        <div class="archive-table-wrap" id="detailView">
          <table class="archive-table">
            <thead><tr><th>TIME</th><th>气温℃</th><th>湿度%</th><th>气压hPa</th><th>LAT</th><th>LON</th><th>TDS</th><th>水温℃</th></tr></thead>
            <tbody id="archiveTbody"></tbody>
          </table>
        </div>
        <div class="curve-wrap" id="curveView" style="display:none">
          <div class="curve-btns" id="curveBtns"></div>
          <div id="historyChart"></div>
        </div>
        <div class="archive-table-wrap" id="summaryView" style="display:none">
          <table class="archive-table">
            <thead><tr><th>日期</th><th>记录数</th><th>气温℃</th><th>湿度%</th><th>气压hPa</th><th>TDS</th><th>水温℃</th></tr></thead>
            <tbody id="summaryTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

<script>
const METRICS = {
  temp:  { en: 'AIR TEMP',    name: '气温', unit: '℃',   color: '#22d3ee', min: -10, max: 45 },
  wt:    { en: 'WATER TEMP',  name: '水温', unit: '℃',   color: '#4ade80', min: -5,  max: 40 },
  hum:   { en: 'HUMIDITY',    name: '湿度', unit: '%',   color: '#a78bfa', min: 0,   max: 100 },
  press: { en: 'PRESSURE',    name: '气压', unit: 'hPa', color: '#fbbf24', min: 900, max: 1100 },
  tds:   { en: 'TDS',         name: 'TDS',  unit: 'ppm', color: '#f472b6', min: 0,   max: 2000 },
};
const THRESHOLD = { temp: [-40, 85], hum: [0, 100], press: [800, 1100], tds: [0, 2000], wt: [-10, 60] };
const GROUPS = [
  { label: '温度', keys: ['temp', 'wt'] },
  { label: '湿度', keys: ['hum'] },
  { label: '气压', keys: ['press'] },
  { label: 'TDS',  keys: ['tds'] },
];

let latest = {};
let currentBuoy = null;
let currentGroup = 0;

const mapChart = echarts.init(document.getElementById('map'));
const trendChart = echarts.init(document.getElementById('trend'));

// roam 期间暂停数据刷新，避免缩放/平移被 setOption 干扰
let roaming = false;
let roamTimer = null;
mapChart.on('georoam', () => {
  roaming = true;
  clearTimeout(roamTimer);
  roamTimer = setTimeout(() => { roaming = false; }, 500);
});

// 终端风 tooltip 通用样式
const TERMINAL_TOOLTIP = {
  backgroundColor: 'rgba(4, 7, 12, 0.92)',
  borderColor: 'rgba(34, 211, 238, 0.55)',
  borderWidth: 1,
  padding: [8, 12],
  textStyle: { color: '#dbe7f0', fontFamily: 'Microsoft YaHei', fontSize: 12 },
  extraCssText: 'box-shadow: 0 0 14px rgba(34,211,238,0.3);',
};

// 加载中国地图 geoJSON（本地 Flask 提供，同源无跨域）
let chinaReady = false;
fetch('/static/china.json')
  .then(r => r.json())
  .then(geo => { echarts.registerMap('china', geo); chinaReady = true; drawMap(); })
  .catch(() => { chinaReady = false; drawMap(); });

// 时钟
setInterval(() => {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  document.getElementById('clock').textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  document.getElementById('date').textContent = `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
}, 1000);

// 指标按钮
GROUPS.forEach((g, i) => {
  const b = document.createElement('div');
  b.className = 'mbtn' + (i === currentGroup ? ' active' : '');
  b.textContent = g.label;
  b.onclick = () => { currentGroup = i; renderBtns(); drawTrend(); };
  document.getElementById('mbtns').appendChild(b);
});
function renderBtns() {
  document.querySelectorAll('.mbtn').forEach((b, i) => b.classList.toggle('active', i === currentGroup));
}

function renderArchive() {
  const box = document.getElementById('archive');
  box.innerHTML = '';
  const ids = Object.keys(latest);
  if (!ids.length) { box.innerHTML = '<div class="empty">NO SIGNAL</div>'; return; }
  if (!currentBuoy || !latest[currentBuoy]) currentBuoy = ids[0];
  ids.forEach(bid => {
    const d = latest[bid];
    const el = document.createElement('div');
    el.className = 'buoy' + (bid === currentBuoy ? ' active' : '');
    el.innerHTML = `<span class="id"><span>#</span>${bid.replace('#','')}</span>
                    <span class="loc">${d.lon.toFixed(2)},${d.lat.toFixed(2)}</span>`;
    el.onclick = () => { currentBuoy = bid; renderArchive(); renderDetail(); drawTrend(); };
    box.appendChild(el);
  });
}

function renderDetail() {
  const box = document.getElementById('detail');
  if (!currentBuoy || !latest[currentBuoy]) { box.innerHTML = '<div class="empty">SELECT A BUOY</div>'; return; }
  const d = latest[currentBuoy];
  const rows = [
    ['ARCHIVE', '#' + currentBuoy.replace('#','')],
    ['LAT', d.lat.toFixed(5) + '°N'],
    ['LON', d.lon.toFixed(5) + '°E'],
    ['TIME', d.ts],
  ];
  box.innerHTML = rows.map(r => `<div class="row"><span class="k">${r[0]}</span><span class="v ${r[0]==='ARCHIVE'?'cyan':''}">${r[1]}</span></div>`).join('');
}

function renderStream() {
  const box = document.getElementById('stream');
  if (!currentBuoy || !latest[currentBuoy]) { box.innerHTML = '<div class="empty">WAITING…</div>'; return; }
  const d = latest[currentBuoy];
  const pct = key => {
    const m = METRICS[key];
    return Math.max(0, Math.min(100, (d[key] - m.min) / (m.max - m.min) * 100));
  };
  const cards = [];
  for (const key of ['temp', 'wt', 'hum', 'press', 'tds']) {
    const m = METRICS[key];
    const lo = THRESHOLD[key][0], hi = THRESHOLD[key][1];
    const state = d[key] < lo || d[key] > hi ? 'bad' : (d[key] < lo*1.1 || d[key] > hi*0.9 ? '' : '');
    cards.push(`<div class="metric ${state}">
      <div class="en">${m.en}</div>
      <div class="val">${d[key]}<span class="unit"> ${m.unit}</span></div>
      <div class="bar"><i style="width:${pct(key)}%"></i></div>
    </div>`);
  }
  box.innerHTML = cards.join('');
}

let mapInited = false;

function drawMap() {
  const pts = Object.entries(latest).map(([bid, d]) => ({
    name: '#' + bid.replace('#', ''),
    value: [d.lon, d.lat],
    temp: d.temp, tds: d.tds,
  }));
  const lon = pts.map(p => p.value[0]), lat = pts.map(p => p.value[1]);
  const cx = lon.length ? (Math.min(...lon) + Math.max(...lon)) / 2 : 119.4;
  const cy = lat.length ? (Math.min(...lat) + Math.max(...lat)) / 2 : 32.2;

  const tooltip = {
    ...TERMINAL_TOOLTIP,
    formatter: p => `<div style="line-height:1.8">` +
      `<span style="color:#22d3ee">■ ${p.name}</span><br>` +
      `LON  ${p.value[0].toFixed(5)}<br>` +
      `LAT  ${p.value[1].toFixed(5)}<br>` +
      `TEMP ${p.data.temp}℃<br>` +
      `TDS  ${p.data.tds}ppm</div>`,
  };

  if (chinaReady) {
    if (!mapInited) {
      // 首次：完整设置 geo（含 zoom/center/roam）
      mapChart.setOption({
        backgroundColor: 'transparent',
        tooltip,
        geo: {
          map: 'china',
          roam: true,
          zoom: 3,
          center: [cx, cy],
          itemStyle: { areaColor: '#0a1620', borderColor: 'rgba(34,211,238,0.4)', borderWidth: 0.8 },
          emphasis: { itemStyle: { areaColor: '#12283a' }, label: { color: '#22d3ee' } },
          label: { show: false },
        },
        series: [{
          name: 'buoy', type: 'scatter', coordinateSystem: 'geo',
          data: pts, symbolSize: 14,
          itemStyle: { color: '#22d3ee', shadowBlur: 16, shadowColor: '#22d3ee' },
          label: { show: true, formatter: '{b}', position: 'top', color: '#dbe7f0', fontSize: 11, fontFamily: 'Microsoft YaHei' },
        }],
      }, { notMerge: true });
      mapInited = true;
    } else {
      // 后续：只更新散点数据，不重置 geo（保留用户的缩放/平移）
      mapChart.setOption({ series: [{ data: pts }] });
    }
  } else {
    // 地图加载失败时退回纯散点
    const span = Math.max(Math.max(...lon) - Math.min(...lon), Math.max(...lat) - Math.min(...lat), 0.2) * 1.7;
    mapChart.setOption({
      backgroundColor: 'transparent',
      tooltip,
      grid: { left: 46, right: 30, top: 40, bottom: 34 },
      xAxis: { type: 'value', min: cx - span, max: cx + span, axisLabel: { color: '#5b7a94', fontSize: 10, fontFamily: 'Microsoft YaHei' }, axisLine: { lineStyle: { color: 'rgba(34,211,238,0.3)' } }, splitLine: { lineStyle: { color: 'rgba(34,211,238,0.08)' } } },
      yAxis: { type: 'value', min: cy - span, max: cy + span, axisLabel: { color: '#5b7a94', fontSize: 10, fontFamily: 'Microsoft YaHei' }, axisLine: { lineStyle: { color: 'rgba(34,211,238,0.3)' } }, splitLine: { lineStyle: { color: 'rgba(34,211,238,0.08)' } } },
      series: [{
        type: 'scatter', symbolSize: 18,
        data: pts,
        itemStyle: { color: '#22d3ee', shadowBlur: 16, shadowColor: '#22d3ee', opacity: 0.9 },
        label: { show: true, formatter: '{b}', position: 'top', color: '#dbe7f0', fontSize: 11, fontFamily: 'Microsoft YaHei' },
      }],
    }, { notMerge: true });
  }
}

async function drawTrend() {
  if (!currentBuoy) return;
  const resp = await fetch('/api/series/' + encodeURIComponent(currentBuoy));
  const data = await resp.json();
  const keys = GROUPS[currentGroup].keys;
  trendChart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 60, right: 28, top: 48, bottom: 30 },
    tooltip: { trigger: 'axis', ...TERMINAL_TOOLTIP },
    legend: { top: 28, textStyle: { color: '#dbe7f0', fontFamily: 'Microsoft YaHei', fontSize: 11 }, data: keys.map(k => METRICS[k].name) },
    xAxis: {
      type: 'time',
      axisLabel: { color: '#5b7a94', fontSize: 10, fontFamily: 'Microsoft YaHei', formatter: v => { const d = new Date(v); const p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; } },
      axisLine: { lineStyle: { color: 'rgba(34,211,238,0.3)' } },
    },
    yAxis: { type: 'value', axisLabel: { color: '#5b7a94', fontFamily: 'Microsoft YaHei' }, splitLine: { lineStyle: { color: 'rgba(34,211,238,0.08)' } } },
    series: keys.map(k => ({
      name: METRICS[k].name, type: 'line', smooth: true, showSymbol: false,
      lineStyle: { color: METRICS[k].color, width: 2, shadowBlur: 8, shadowColor: METRICS[k].color },
      itemStyle: { color: METRICS[k].color },
      areaStyle: { color: METRICS[k].color, opacity: 0.08 },
      data: (data[k] || []).map(([ts, v]) => [Date.parse(ts.replace(' ', 'T')), v]),
    })),
  }, { notMerge: true });
}

async function refresh() {
  try {
    const resp = await fetch('/api/latest');
    latest = await resp.json();
    if (!Object.keys(latest).length) return;
    renderArchive();
    renderDetail();
    renderStream();
    if (!roaming) drawMap();
    drawTrend();
  } catch (e) {}
}

refresh();
setInterval(refresh, 2000);

// ===== 告警检测（物理一致性异常）=====
function checkAlarms() {
  fetch('/api/alarms')
    .then(r => r.json())
    .then(data => {
      const bar = document.getElementById('alarmBar');
      const status = document.getElementById('sysStatus');
      const list = Object.entries(data).flatMap(([bid, arr]) => arr.map(a => ({ bid, ...a })));
      // 只看最近 30 秒内的告警，超时的历史告警自动消退
      const now = Date.now();
      const recent = list.filter(a => now - Date.parse(a.ts.replace(' ', 'T')) < 30000);
      if (recent.length) {
        const latest = recent[recent.length - 1];
        const parts = [`⚠ ALARM  ${latest.bid}  ${latest.ts}  ${latest.type}`];
        if (latest.hum_alarm) parts.push(`湿度快变 ${latest.hum_fast}`);
        if (latest.wt_alarm) parts.push(`水温快变 ${latest.wt_fast}`);
        bar.textContent = parts.join('　');
        bar.style.display = 'block';
        status.className = 'alarm';
        status.innerHTML = '<span class="dot"></span>ALARM';
      } else {
        bar.style.display = 'none';
        status.className = 'online';
        status.innerHTML = '<span class="dot"></span>SYSTEM ONLINE';
      }
    })
    .catch(() => {});
}
checkAlarms();
setInterval(checkAlarms, 3000);

// ===== 档案库（历史数据） =====
const modal = document.getElementById('archiveModal');
const historyChart = echarts.init(document.getElementById('historyChart'));
let archiveTab = 'detail';
let selectedDate = null;
let curveGroup = 0;

document.getElementById('openArchive').onclick = () => {
  modal.classList.add('show');
  document.getElementById('archiveBuoyTag').textContent = currentBuoy ? ('#' + currentBuoy.replace('#','')) : '';
  loadDates();
  loadSummary();
};
document.getElementById('closeArchive').onclick = () => modal.classList.remove('show');
document.getElementById('exportCsv').onclick = exportCsv;
document.getElementById('refreshArchive').onclick = () => {
  loadDates();
  loadSummary();
  if (archiveTab === 'curve' && selectedDate) loadCurve(selectedDate);
};

// 曲线指标组按钮
GROUPS.forEach((g, i) => {
  const b = document.createElement('div');
  b.className = 'cbtn' + (i === curveGroup ? ' active' : '');
  b.textContent = g.label;
  b.onclick = () => {
    curveGroup = i;
    document.querySelectorAll('.cbtn').forEach((x, j) => x.classList.toggle('active', j === i));
    if (selectedDate) loadCurve(selectedDate);
  };
  document.getElementById('curveBtns').appendChild(b);
});

// tab 切换
document.querySelectorAll('.atab').forEach(t => {
  t.onclick = () => {
    archiveTab = t.dataset.tab;
    document.querySelectorAll('.atab').forEach(x => x.classList.toggle('active', x === t));
    document.getElementById('detailView').style.display = archiveTab === 'detail' ? '' : 'none';
    document.getElementById('curveView').style.display = archiveTab === 'curve' ? '' : 'none';
    document.getElementById('summaryView').style.display = archiveTab === 'summary' ? '' : 'none';
    if (archiveTab === 'curve' && selectedDate) { historyChart.resize(); loadCurve(selectedDate); }
  };
});

async function loadDates() {
  const resp = await fetch('/api/archive/dates');
  const dates = await resp.json();
  const box = document.getElementById('dateList');
  box.innerHTML = '';
  if (!dates.length) {
    box.innerHTML = '<div style="padding:20px;color:var(--dim);font-family:var(--mono);font-size:12px;text-align:center">NO DATA</div>';
    return;
  }
  dates.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.textContent = d;
    el.onclick = () => {
      document.querySelectorAll('.date-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      selectedDate = d;
      if (archiveTab === 'detail') loadHistory(d);
      if (archiveTab === 'curve') loadCurve(d);
    };
    box.appendChild(el);
  });
  selectedDate = dates[0];
  loadHistory(dates[0]);
}

async function loadHistory(date) {
  if (!currentBuoy) return;
  const resp = await fetch('/api/history/' + encodeURIComponent(currentBuoy) + '?date=' + date);
  const rows = await resp.json();
  const tbody = document.getElementById('archiveTbody');
  if (rows.error) { tbody.innerHTML = `<tr><td colspan="8" style="color:var(--red)">${rows.error}</td></tr>`; return; }
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--dim)">该日期无数据</td></tr>'; return; }
  rows.reverse();  // 后端 DESC 返回新到旧，反转为早到晚显示
  tbody.innerHTML = rows.map(r =>
    `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td></tr>`
  ).join('');
}

async function loadCurve(date) {
  if (!currentBuoy) return;
  const resp = await fetch('/api/history/' + encodeURIComponent(currentBuoy) + '?date=' + date + '&limit=2000');
  const rows = await resp.json();
  if (rows.error || !rows.length) return;
  const col = { temp: 1, hum: 2, press: 3, tds: 6, wt: 7 };
  const keys = GROUPS[curveGroup].keys;
  historyChart.setOption({
    backgroundColor: 'transparent',
    grid: { left: 50, right: 24, top: 44, bottom: 30 },
    tooltip: { trigger: 'axis', ...TERMINAL_TOOLTIP },
    legend: { top: 10, textStyle: { color: '#dbe7f0', fontFamily: 'Microsoft YaHei', fontSize: 11 }, data: keys.map(k => METRICS[k].name) },
    xAxis: { type: 'time', axisLabel: { color: '#5b7a94', fontSize: 10, fontFamily: 'Microsoft YaHei', formatter: v => { const d = new Date(v); const p = n => String(n).padStart(2, '0'); return `${p(d.getHours())}:${p(d.getMinutes())}`; } }, axisLine: { lineStyle: { color: 'rgba(34,211,238,0.3)' } } },
    yAxis: { type: 'value', axisLabel: { color: '#5b7a94', fontFamily: 'Microsoft YaHei' }, splitLine: { lineStyle: { color: 'rgba(34,211,238,0.08)' } } },
    series: keys.map(k => ({
      name: METRICS[k].name, type: 'line', smooth: true, showSymbol: false,
      lineStyle: { color: METRICS[k].color, width: 1.5 },
      itemStyle: { color: METRICS[k].color },
      areaStyle: { color: METRICS[k].color, opacity: 0.06 },
      data: rows.map(r => [Date.parse(r[0].replace(' ', 'T')), r[col[k]]]),
    })),
  }, { notMerge: true });
}

async function loadSummary() {
  if (!currentBuoy) return;
  const resp = await fetch('/api/archive/summary?buoy=' + encodeURIComponent(currentBuoy));
  const rows = await resp.json();
  const tbody = document.getElementById('summaryTbody');
  if (rows.error) { tbody.innerHTML = `<tr><td colspan="7" style="color:var(--red)">${rows.error}</td></tr>`; return; }
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--dim)">暂无汇总数据</td></tr>'; return; }
  tbody.innerHTML = rows.map(r => {
    const fmt = (avg, mn, mx) => `${avg}<span style="color:var(--dim)"> [${mn}~${mx}]</span>`;
    return `<tr><td>${r[0]}</td><td>${r[1]}</td>` +
      `<td>${fmt(r[2], r[3], r[4])}</td>` +
      `<td>${fmt(r[5], r[6], r[7])}</td>` +
      `<td>${fmt(r[8], r[9], r[10])}</td>` +
      `<td>${fmt(r[11], r[12], r[13])}</td>` +
      `<td>${fmt(r[14], r[15], r[16])}</td></tr>`;
  }).join('');
}

function exportCsv() {
  if (!currentBuoy || !selectedDate) return;
  fetch('/api/history/' + encodeURIComponent(currentBuoy) + '?date=' + selectedDate + '&limit=10000')
    .then(r => r.json())
    .then(rows => {
      if (rows.error || !rows.length) { alert('该日期无数据可导出'); return; }
      const header = 'TIME,气温℃,湿度%,气压hPa,LAT,LON,TDS,水温℃';
      const csv = '﻿' + header + '\n' + rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentBuoy.replace('#', '') + '_' + selectedDate + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    });
}
</script>
</body>
</html>
